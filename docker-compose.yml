services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sed
      POSTGRES_USER: sed_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sed_local_dev}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sed_admin -d sed"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://sed_admin:${POSTGRES_PASSWORD:-sed_local_dev}@db:5432/sed
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
